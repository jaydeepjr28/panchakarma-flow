services:
  postgres:
    image: postgres:16-alpine
    container_name: panchakarma-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-panchakarma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-panchakarma_secret_2026}
      POSTGRES_DB: ${DB_NAME:-identity_db}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-panchakarma} -d ${DB_NAME:-identity_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - panchakarma-net

  redis:
    image: redis:7.2-alpine
    container_name: panchakarma-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - panchakarma-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: panchakarma-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      # KRaft mode configuration (Zero Zookeeper required)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - panchakarma-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: panchakarma-kafka-ui
    restart: always
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - panchakarma-net

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  panchakarma-net:
    driver: bridge
